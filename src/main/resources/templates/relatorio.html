<!DOCTYPE html>
                <html xmlns:th="http://www.thymeleaf.org">
                <head>
                    <meta charset="UTF-8"/>
                    <style>
                    @font-face {
        				font-family: 'Neulis-Sans';
        				src: url('./fonts/fonnts.com-Neulis_Sans_Regular.otf') format('opentype');
        				font-weight: normal;
        				font-style: normal;
        				}

						@font-face {
						    font-family: 'Neulis-Sans';
						    src: url('./fonts/fonnts.com-Neulis_Sans_Semi_Bold.otf') format('opentype');
						    font-weight: bold;
						    font-style: normal;
						}
                        body { font-family: 'Neulis-Sans', sans-serif; padding: 20px; }
                        h1 { text-align: center; }
                        table { width: 100%; border-collapse: collapse; margin-top: 25px; }
                        table, th, td { border: 1px solid #666; }
                        th { background: #eee; padding: 8px; text-align: center; }
                        td { padding: 6px; text-align: center; }
                    </style>
                </head>
                <body>
                <h1>Relatório de Frequência - Turma <span th:text="${turmaNome}"></span>
				</h1>
                <table>
                    <thead>
                    <tr>
                        <th>Aluno</th>
                        <th>Horas Presentes</th>
                        <th>Carga Total</th>
                        <th>% Presença</th>
                        <th>% Faltas</th>
                    </tr>
                    </thead>
                    <tbody>
                        <tr th:each="aluno:${alunos}">
							<td th:text="${aluno.nomeAluno}"></td>
							<td th:text="${aluno.horasPresenteTotal}"></td>
							<td th:text="${aluno.cargaHorariaTotal}"></td>
							<td th:text="${#numbers.formatDecimal(aluno.percentualPresenca, 1, 2)} + '%'"></td>
							<td th:text="${#numbers.formatDecimal(100 - aluno.percentualPresenca, 1, 2)} + '%'"></td>
						</tr>
                    </tbody>
                </table>
                </body>
                </html>
