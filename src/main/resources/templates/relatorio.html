<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>

    <style>
        @font-face {
            font-family: 'Neulis-Sans';
            src: url('./fonts/fonnts.com-Neulis_Sans_Regular.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'Neulis-Sans';
            src: url('./fonts/fonnts.com-Neulis_Sans_Semi_Bold.otf') format('opentype');
            font-weight: bold;
            font-style: normal;
        }

        body {
            font-family: 'Neulis-Sans', sans-serif;
            padding: 0;
            margin: 0;
            color: #2A2A2A;
            padding-bottom: 80px;
        }

        /* Faixa vermelha superior */
        .top-bar {
            width: 100%;
            background: #D00909;
            padding: 20px 35px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }

        .top-bar img {
            width: 90px;
        }

        /* Conteúdo principal */
        .content {
            padding: 35px;
        }

        h1 {
            margin: 0;
            padding-bottom: 8px;
            border-bottom: 4px solid #D00909;
            font-size: 26px;
            color: #2A2A2A;
        }

        /* Card de informações */
        .info-card {
            padding: 12px 18px;
            margin-top: 20px;
            margin-bottom: 25px;
        }

        .info-card p {
            margin: 4px 0;
            font-size: 14px;
            color: #2A2A2A;
        }

        .info-card .right {
            text-align: right;
            color: #555555;
        }

        /* Tabela */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: #ffffff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        th {
            background: #D00909;
            color: #FFFFFF;
            padding: 12px;
            font-size: 14px;
            border: none;
        }

        td {
            padding: 10px;
            font-size: 13px;
            border-bottom: 1px solid #e0e0e0;
			text-align: center
        }

        tbody tr:nth-child(even) {
            background: #f5f5f5;
        }

    </style>
</head>

<body>

<div class="top-bar">
    <img src="./images/logo.png" alt="Logo"/>
</div>

<div class="content">

    <h1>Relatório de Frequência<br>
        <span style="font-size: 18px; font-weight: normal;">Turma <span th:text="${turmaNome}"></span></span>
    </h1>

    <div class="info-card">
        <p><strong>Professor(a):</strong> <span th:text="${professorNome}"></span></p>
        <p class="right">Gerado em: <span th:text="${dataHoraGeracao}"></span></p>
    </div>

    <table>
        <thead>
            <tr>
                <th>Aluno</th>
                <th>Horas Presentes</th>
                <th>Carga Total</th>
                <th>% Presença</th>
                <th>% Faltas</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="aluno : ${alunos}">
                <td th:text="${aluno.nomeAluno}"></td>
                <td th:text="${aluno.horasPresenteTotal}"></td>
                <td th:text="${aluno.cargaHorariaTotal}"></td>
                <td th:text="${#numbers.formatDecimal(aluno.percentualPresenca, 1, 2)} + '%'"></td>
                <td th:text="${#numbers.formatDecimal(100 - aluno.percentualPresenca, 1, 2)} + '%'"></td>
            </tr>
        </tbody>
    </table>

</div>

</body>
</html>
