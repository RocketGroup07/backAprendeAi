<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Código de Redefinição</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap');

        body {
            font-family: "Montserrat", sans-serif;
            background: #ffffff;
            padding: 0;
            margin: 0;
        }

        .container {
            max-width: 480px;
            margin: 40px auto;
            padding: 25px;
            background: #000000;
            border-radius: 10px;
            color: #ffffff;
        }

        h2 {
            color: #ffffff;
            text-align: center;
        }

        p {
            font-size: 15px;
            color: #f1f1f1;
        }

        .code-wrapper {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }

        .digit-box {
            /*background: #c40000;*/
            width: 48px;
            height: 48px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 22px;
            font-weight: bold;
        }

        .footer {
            font-size: 12px;
            text-align: center;
            margin-top: 30px;
            color: #cccccc;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Redefinição de Senha</h2>

    <p>Olá,</p>

    <p>Seu código para redefinição de senha está abaixo:</p>

    <div class="code-wrapper">
        <span class="digit-box" th:text="${codigo}"></span>
    </div>

    <p style="margin-top: 20px;">
        Este código expira em <strong th:text="${minutos}"></strong> minutos.
    </p>

    <p>Se você não solicitou isso, ignore este e-mail.</p>

    <div class="footer">
        &copy; Aprende Aí — 2025
    </div>
</div>

</body>
</html>
